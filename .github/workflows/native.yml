name: native

on:
  push:
    branches:
      - main
      - ci-sandbox
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  ccache_basedir: ${{ github.workspace }}
  ccache_dir: "${{ github.workspace }}/.ccache"
  ccache_compilercheck: content
  ccache_compress: "true"
  ccache_compresslevel: "9"
  ccache_maxsize: 200M
  ccache_cmake: -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache

jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 full
            os: ubuntu-22.04
            identifier: ubuntu_2204_full
            cmake: -DCOMPILE_TESTS=on
            brt_tags: ""
            unittests: "true"
          - name: Ubuntu 22.04 minimal
            os: ubuntu-22.04
            identifier: ubuntu_2204_minimal
            cmake: -DCOMPILE_TESTS=on -DUSE_WASM_COMPATIBLE_SOURCE=on
            brt_tags: "'#wasm'"
            unittests: "false"
          - name: Ubuntu 24.04 full
            os: ubuntu-24.04
            identifier: ubuntu_2404_full
            cmake: -DCOMPILE_TESTS=on
            brt_tags: ""
            unittests: "true"
          - name: Ubuntu 24.04 minimal
            os: ubuntu-24.04
            identifier: ubuntu_2404_minimal
            cmake: -DCOMPILE_TESTS=on -DUSE_WASM_COMPATIBLE_SOURCE=on
            brt_tags: "'#wasm'"
            unittests: "false"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libprotobuf-dev protobuf-compiler libboost-all-dev ccache libunwind-dev libgoogle-perftools-dev


      - name: Install MKL
        run: |
          wget -qO- "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB" | gpg --dearmor | sudo tee /usr/share/keyrings/intel-mkl-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/intel-mkl-archive-keyring.gpg] https://apt.repos.intel.com/mkl all main" | sudo tee /etc/apt/sources.list.d/intel-mkl.list
          sudo apt-get update -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/intel-mkl.list"
          sudo apt-get install -y --no-install-recommends intel-mkl-64bit-2020.0-088

      - name: Generate ccache_vars
        shell: bash
        id: ccache_vars
        run: |
          echo "hash=${{ env.ccache_compilercheck }}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date '+%Y-%m-%dT%H.%M.%S')" >> "$GITHUB_OUTPUT"

      - name: Cache build with ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ccache_dir }}
          key: ccache-${{ matrix.identifier }}-${{ steps.ccache_vars.outputs.hash }}-${{ github.ref }}-${{ steps.ccache_vars.outputs.timestamp }}
          restore-keys: |
            ccache-${{ matrix.identifier }}-${{ steps.ccache_vars.outputs.hash }}-${{ github.ref }}
            ccache-${{ matrix.identifier }}-${{ steps.ccache_vars.outputs.hash }}
            ccache-${{ matrix.identifier }}

      - name: ccache environment setup
        run: |
          echo "CCACHE_COMPILER_CHECK=${{ env.ccache_compilercheck }}" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=${{ env.ccache_basedir }}" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=${{ env.ccache_compress }}" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESSLEVEL=${{ env.ccache_compresslevel }}" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${{ env.ccache_dir }}" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=${{ env.ccache_maxsize }}" >> "$GITHUB_ENV"

      - name: ccache prolog
        run: |
          ccache -s
          ccache -z

      - name: cmake
        run: |
          mkdir -p build
          cd build
          cmake -L .. -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ${{ matrix.cmake }} ${{ env.ccache_cmake }}

      - name: Build from source
        working-directory: build
        run: make -j2

      - name: ccache epilog
        run: ccache -s

      - name: Print Versions
        working-directory: build
        run: ./app/bergamot --version

      - name: Run unit tests
        working-directory: build
        if: matrix.unittests == 'true'
        run: make test

      - name: Install regression-test framework (BRT)
        working-directory: bergamot-translator-tests
        run: make install

      - name: Run regression-tests (BRT)
        working-directory: bergamot-translator-tests
        id: brt_run
        run: MARIAN=../build ./run_brt.sh ${{ matrix.brt_tags }}

      - name: Print logs of unsuccessful BRTs
        working-directory: bergamot-translator-tests
        if: always() && steps.brt_run.outcome == 'failure'
        run: |
          grep "tests.*.sh" previous.log \
            | sed 's/^\s*-\s*//' \
            | xargs -I% bash -c 'echo %; tail -n20 %.log'

      - name: Upload regression-tests artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.brt_run.outcome != 'skipped'
        with:
          name: brt-${{ matrix.identifier }}
          path: |
            bergamot-translator-tests/**/*.expected
            bergamot-translator-tests/**/*.log
            bergamot-translator-tests/**/*.out

      - name: Confirm native-run example script works
        run: bash examples/run-native.sh

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS full
            os: macos-latest
            identifier: mac_full
            cmake: -DCOMPILE_TESTS=on -DUSE_APPLE_ACCELERATE=off -DUSE_FBGEMM=off -DUSE_STATIC_LIBS=off
            brt_tags: ""
            unittests: "true"
          - name: macOS minimal
            os: macos-latest
            identifier: mac_minimal
            cmake: -DCOMPILE_TESTS=on -DUSE_APPLE_ACCELERATE=off -DUSE_FBGEMM=off -DUSE_STATIC_LIBS=on -DUSE_WASM_COMPATIBLE_SOURCE=on
            brt_tags: "'#'wasm'"
            unittests: "false"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install openblas protobuf ccache
          brew install coreutils findutils

      - name: Setup path with GNU tools
        run: |
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/findutils/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup BLAS
        run: |
          echo "LDFLAGS=-L$(brew --prefix)/opt/openblas/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix)/opt/openblas/include" >> "$GITHUB_ENV"

      - name: Generate ccache_vars
        shell: bash
        id: ccache_vars
        run: |
          echo "hash=${{ env.ccache_compilercheck }}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date '+%Y-%m-%dT%H.%M.%S')" >> "$GITHUB_OUTPUT"

      - name: Cache build with ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ccache_dir }}
          key: ccache-${{ matrix.identifier }}-${{ steps.ccache_vars.outputs.hash }}-${{ github.ref }}-${{ steps.ccache_vars.outputs.timestamp }}
          restore-keys: |
            ccache-${{ matrix.identifier }}-${{ steps.ccache_vars.outputs.hash }}-${{ github.ref }}
            ccache-${{ matrix.identifier }}-${{ steps.ccache_vars.outputs.hash }}
            ccache-${{ matrix.identifier }}

      - name: ccache environment setup
        run: |
          echo "CCACHE_COMPILER_CHECK=${{ env.ccache_compilercheck }}" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=${{ env.ccache_basedir }}" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=${{ env.ccache_compress }}" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESSLEVEL=${{ env.ccache_compresslevel }}" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${{ env.ccache_dir }}" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=${{ env.ccache_maxsize }}" >> "$GITHUB_ENV"

      - name: ccache prolog
        run: |
          ccache -s
          ccache -z

      - name: cmake
        run: |
          mkdir -p build
          cd build
          cmake -L .. -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ${{ matrix.cmake }} ${{ env.ccache_cmake }}

      - name: Build from source
        working-directory: build
        run: make -j2

      - name: ccache epilog
        run: ccache -s

      - name: Print Versions
        working-directory: build
        run: ./app/bergamot --version

      - name: Run unit tests
        working-directory: build
        if: matrix.unittests == 'true'
        run: make test

      - name: Install regression-test framework (BRT)
        working-directory: bergamot-translator-tests
        run: make install

      - name: Run regression-tests (BRT)
        working-directory: bergamot-translator-tests
        id: brt_run
        run: MARIAN=../build ./run_brt.sh ${{ matrix.brt_tags }}

      - name: Print logs of unsuccessful BRTs
        working-directory: bergamot-translator-tests
        if: always() && steps.brt_run.outcome == 'failure'
        run: |
          grep "tests.*.sh" previous.log \
            | sed 's/^\s*-\s*//' \
            | xargs -I% bash -c 'echo %; tail -n20 %.log'

      - name: Upload regression-tests artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.brt_run.outcome != 'skipped'
        with:
          name: brt-${{ matrix.identifier }}
          path: |
            bergamot-translator-tests/**/*.expected
            bergamot-translator-tests/**/*.log
            bergamot-translator-tests/**/*.out

      - name: Confirm native-run example script works
        run: bash examples/run-native.sh
